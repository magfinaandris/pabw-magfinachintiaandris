<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Film Saya</title>
  <link rel="icon" href="data:,">

  <!-- urutan: token -> dasar -> tata letak -> komponen -> tema -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="komponen.css">
  <link rel="stylesheet" href="tema.css">
</head>
<body>
  <header>
    <div class="header-baris">
      <input type="checkbox" id="tema" class="pengalih-tema">
      <h1>Catatan Film Saya</h1>
      <nav aria-label="Navigasi utama">
        <ul>
          <li><a href="#daftar-film">Daftar Film</a></li>
          <li><a href="#tambah-film">Tambah Film</a></li>
          <li><a href="#tentang-saya">Tentang Saya</a></li>
        </ul>
      </nav>
      <label for="tema" class="tombol-tema">Tema gelap</label>
    </div>
  </header>

  <main>
    <section id="daftar-film">
      <h2>Daftar Film</h2>
      <div class="katalog">
        <div class="kartu kartu-lebar">
          <div id="filter" class="filter">
            <button type="button" data-kategori="semua" class="aktif">Semua</button>
            <button type="button" data-kategori="Romantis">Romantis</button>
            <button type="button" data-kategori="Drama">Drama</button>
            <button type="button" data-kategori="Komedi">Komedi</button>
            <button type="button" data-kategori="Aksi">Aksi</button>
            <button type="button" data-kategori="Lainnya">Lainnya</button>
          </div>

          <div class="tabel-gulir" role="region" aria-label="Tabel daftar film" tabindex="0">
            <table>
              <caption>Daftar film yang pernah saya tonton</caption>
              <thead>
                <tr>
                  <th scope="col">Judul</th>
                  <th scope="col">Tahun</th>
                  <th scope="col">Sutradara</th>
                  <th scope="col">Rating Saya</th>
                </tr>
              </thead>
              <tbody id="daftar"></tbody>
            </table>
          </div>

          <p id="kosong" role="status" hidden>Belum ada film pada kategori ini.</p>
        </div>

        <div class="kartu">
          <figure>
            <img src="film-1.jpg"
                 alt="Poster film Dilan 1990: seorang siswi berseragam dan seorang siswa di atas sepeda motor saling berhadapan di jalan tanah di bawah pohon besar, diterangi cahaya matahari senja"
                 width="300" height="450" loading="lazy">
            <figcaption>Poster film Dilan 1990</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section id="tambah-film">
      <h2>Tambah Film</h2>

      <form class="kartu form-tambah" novalidate>
        <div class="form-kolom">
          <label for="judul-film">Judul Film</label>
          <input type="text" id="judul-film" name="judul-film" required aria-describedby="galat-judul">
          <p class="pesan-galat" id="galat-judul" aria-live="polite"></p>
        </div>

        <div class="form-kolom">
          <label for="tahun-film">Tahun Rilis</label>
          <input type="number" id="tahun-film" name="tahun-film" min="1900" max="2026" required aria-describedby="galat-tahun">
          <p class="pesan-galat" id="galat-tahun" aria-live="polite"></p>
        </div>

        <div class="form-kolom">
          <label for="sutradara">Sutradara</label>
          <input type="text" id="sutradara" name="sutradara" required aria-describedby="galat-sutradara">
          <p class="pesan-galat" id="galat-sutradara" aria-live="polite"></p>
        </div>

        <div class="form-kolom">
          <label for="rating">Rating Saya</label>
          <input type="number" id="rating" name="rating" min="1" max="10" required aria-describedby="galat-rating">
          <p class="pesan-galat" id="galat-rating" aria-live="polite"></p>
        </div>

        <button type="submit">Tambah Film</button>
      </form>
    </section>
  </main>

  <footer>
    <p id="tentang-saya">Magfina Chintia Andris · 25523271 · 2026</p>
  </footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/dom.js"></script>
</body>
</html>
